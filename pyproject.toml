[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inhibitory-behaviour-pipeline"
version = "0.1.0"
description = "Behaviour analysis pipeline for inhibitory control tasks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inhibitory_behaviour_pipeline*"]
exclude = ["tests*"]